name: agnes_ai_tester
description: "A local Flutter test console for the Agnes AI API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.11.1
  file: ^7.0.1
  file_picker: ^12.3.0
  freezed: ^4.0.1
  freezed_annotation: ^3.1.0
  flutter_riverpod: ^3.4.2
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.6
  retrofit: ^4.10.0
  go_router: ^17.2.3
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: 2.4.2
  sqflite_common_ffi: 2.3.7+1
  sqflite_common_ffi_web: 1.0.2
  video_player: ^2.10.1
  cached_video_player_plus: ^4.1.0
  flutter_cache_manager: ^3.4.2
  video_player_win: ^3.2.2

dependency_overrides:
  # Keep the Windows end-of-playback fix in the project until it is available
  # in the upstream video_player_win package.
  video_player_win:
    path: third_party/video_player_win

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  riverpod_generator: ^4.0.8
  build_runner: ^2.16.0
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.11

flutter:

  # 下面这行代码确保 Material Icons 字体被包含在您的应用程序中，
  # 从而使您能够使用 Material Icons 类中的图标。
  uses-material-design: true

