name: agnes_ai_tester
description: "A local Flutter test console for the Agnes AI API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # 网络请求
  dio: ^5.11.1
  retrofit: ^4.10.0

  # 状态管理
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # 路由管理
  go_router: ^17.2.3

  # 序列化处理
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # 数据库
  drift: ^2.35.4
  drift_flutter: ^0.3.1

  # 文件管理
  path: ^1.9.1
  path_provider: ^2.1.5
  file: ^7.0.1
  file_picker: ^12.3.0

  # 缓存管理
  flutter_cache_manager: ^3.4.5

  # 视频播放器
  video_player: ^2.14.0
  cached_video_player_plus: ^4.1.0
  video_player_win: ^3.3.0
  fvp: ^0.38.1 # 修复特定机型视频播放兼容性问题

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # 代码生成
  build_runner: ^2.16.0
  drift_dev: ^2.35.3
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.11
  riverpod_generator: ^4.0.8

flutter:

  # 下面这行代码确保 Material Icons 字体被包含在您的应用程序中，
  # 从而使您能够使用 Material Icons 类中的图标。
  uses-material-design: true

